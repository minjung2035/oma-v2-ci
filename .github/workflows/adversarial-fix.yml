name: adversarial-fix

on:
  push:
    branches:
      - fix/adversarial-contract-integrity

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adversarial-contract-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Apply patches
        run: python3 tools/adversarial-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/adversarial-fix.yml tools/adversarial-fix.py
          git add src implementation test
          git commit -m "fix: harden contract and integrity boundaries"
          git push origin HEAD:fix/adversarial-contract-integrity
