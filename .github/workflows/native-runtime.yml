name: Native runtime
on:
  push:
    branches: [work/macos-native-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.0.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build the same 25 workspaces on the actual OS
        run: npm run build:workspaces
      - name: Run shared production primitives and streaming verification
        run: |
          mkdir -p .scratch/native-runtime
          git rev-parse HEAD > .scratch/native-runtime/source-head.txt
          node --test test/native-primitives.test.mjs test/restic-tar.test.mjs > .scratch/native-runtime/tests.log 2>&1
      - name: Preserve shared runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-runtime-${{ matrix.os }}-${{ github.sha }}
          path: .scratch/native-runtime
          if-no-files-found: error
          retention-days: 14
  darwin-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.0.0'
          package-manager-cache: false
      - name: Observe real Darwin gates
        run: node scripts/verify-native.mjs .scratch/native-evidence
      - name: Preserve raw observations, including blocked gates
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-gates-${{ matrix.os }}-${{ github.sha }}
          path: .scratch/native-evidence
          if-no-files-found: error
          retention-days: 14
