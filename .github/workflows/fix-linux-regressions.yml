name: apply-linux-regression-fixes

on:
  push:
    branches: [fix/adversarial-contract-integrity]
    paths: [.github/workflows/fix-linux-regressions.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adversarial-contract-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
      - name: Apply focused regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new, count))

          # CFG-005: quota fields are non-negative; zero is a valid disabled/empty budget.
          exact('src/config.ts',
                'const inferenceSlots = needInt(quota["inferenceSlots"], "quota.inferenceSlots", 1);',
                'const inferenceSlots = needInt(quota["inferenceSlots"], "quota.inferenceSlots", 0);')
          exact('src/config.ts',
                'needInt(quota["storageBytes"], "quota.storageBytes", 1);',
                'needInt(quota["storageBytes"], "quota.storageBytes", 0);')

          # Persisted reply ancestry is RFC Message-ID data. The file id itself remains the
          # strict base m-<uuid>-<ordinal>, while ancestry may carry the OMA domain suffix.
          exact('src/validate.ts',
                'const messageIdCheck = checkString({ re: /^m-[0-9a-f-]{36}-\\d+$/ });\nconst operationIdCheck = checkString({ re: /^op-[0-9a-f-]{36}$/ });',
                'const messageIdCheck = checkString({ re: /^m-[0-9a-f-]{36}-\\d+$/ });\nconst headerMessageIdCheck = checkString({ re: /^m-[0-9a-f-]{36}-\\d+(?:@[a-z][a-z0-9-]{0,31}\\.oma\\.invalid)?$/ });\nconst operationIdCheck = checkString({ re: /^op-[0-9a-f-]{36}$/ });')
          exact('src/validate.ts',
                '    inReplyTo: v => v === null ? null : messageIdCheck(v),\n    references: checkArray(messageIdCheck),',
                '    inReplyTo: v => v === null ? null : headerMessageIdCheck(v),\n    references: checkArray(headerMessageIdCheck),')

          # New terminal-state regression fixture must satisfy the operations.actor FK.
          exact('test/adversarial-contract-fixes.test.ts',
                '  try {\n    store.transaction(() => {\n      store.insertOperation({',
                '  try {\n    store.transaction(() => {\n      store.insertAgent({\n        name: "alice",\n        specHash: "alice",\n        role: "resident",\n        desired: "enabled",\n        incarnation: 0,\n        profile: "resident",\n        createdBy: null,\n        specJson: "{}",\n      });\n      store.insertOperation({')

          # The serialization scenario must be a valid streamed request; malformed-media
          # negatives are covered separately and are now rejected pre-stream by design.
          p = Path('test/audit2.test.ts')
          s = p.read_text()
          s, n = re.subn(r'(id: "c1",[\\s\\S]{0,1400}?mediaType: )"x"',
                         r'\\1"application/x-git-bundle"', s, count=1)
          if n != 1:
              raise SystemExit(f'test/audit2.test.ts: serialize mediaType replacement count={n}')
          p.write_text(s)

          # Header field names are RFC-case-insensitive. Assert the header section without
          # requiring a serializer-specific spelling; body bytes must stay untouched.
          exact('test/phase3.test.ts',
                '  assert.ok(emlDirect.text.includes("X-OMA-Kind: message"));',
                '  assert.match(emlDirect.text.split(/\\r?\\n\\r?\\n/, 1)[0]!, /^X-OMA-Kind: message$/im);')

          # Trusted batch DTO validation correctly rejects the old synthetic m-x-0 fixture.
          exact('test/phase5.test.ts',
                '      messageIds: ["m-x-0"],',
                '      messageIds: ["m-00000000-0000-4000-8000-000000000001-0"],')

          # DB MessagePlan stores logical addresses by contract; RFC encoding is presentation.
          exact('test/phase7.test.ts',
                '    assert.deepEqual(frozenMessage.message.to, ["commons@demo.oma.invalid"]);',
                '    assert.deepEqual(frozenMessage.message.to, ["commons"]);')

          # Remove this one-shot workflow from the resulting product diff.
          Path('.github/workflows/fix-linux-regressions.yml').unlink()
          PY
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        id: test
        continue-on-error: true
        run: npm test
      - name: Commit fixes
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair Linux regression failures'
            git push origin HEAD:fix/adversarial-contract-integrity
          fi
      - name: Preserve test status
        if: steps.test.outcome == 'failure'
        run: exit 1
