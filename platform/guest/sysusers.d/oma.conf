# The guest's two accounts (systemd-sysusers, applied when the image is built).
#
# oma: owns the state disk and runs every society; its user manager (linger on)
#   runs the Residents' units.
# oma-bridge: runs the vsock bridge instances and nothing else. guestctl and
#   guesthost answer this uid alone (MAC-202), so no process of `oma` can reach
#   them by opening their sockets.
u oma        1000 "OMA"             /var/lib/oma/home /usr/sbin/nologin
u oma-bridge -    "OMA host bridge" -                 /usr/sbin/nologin
