# DR18 (D-10): the guest's user manager names the egress service's socket to
# every unit it starts -- a Resident's runner, a society's session holder and
# its `oma`. Its presence is what makes a run ask the host for a placeholder
# instead of resolving a credential it does not have (runtime/egress-forwarder).
# guesthost listens there (src/entry/guesthost.ts).
OMA_EGRESS_SOCKET=${XDG_RUNTIME_DIR}/oma-egress.sock
